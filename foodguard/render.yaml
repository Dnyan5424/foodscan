services:
  - type: web
    name: foodguard-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: OCR_SPACE_API_KEY
        sync: false

  - type: web
    name: foodguard-ml
    runtime: docker
    dockerfilePath: ./ml_service/Dockerfile
    dockerContext: ./ml_service
    healthCheckPath: /
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: foodguard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_ML_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
